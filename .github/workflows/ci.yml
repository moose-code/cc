# Per-change checks. `changes` reads the changed paths, the web and contracts jobs run only when
# their paths changed, and `ci-ok` always reports: it is the one required status check, and it
# passes when every job succeeded or was skipped.
# contracts follows the AGENTS.md rule: forge build plus the test files the change touched. The
# full suite, the rehearsal and the deep invariants run in the candidate workflow.
# Fork tests run against an anvil that forks mainnet at block 26158000 and loads the tracked master
# stack fixture (script/config/stack-master-26158000.hex), with STACK=master and --chain-id 1.
# UPSTREAM_RPC_URL is the repo secret MAINNET_RPC_URL when set, else the public tenderly gateway,
# which serves archive state at the pinned block. foundry-toolchain saves foundry's rpc cache.
name: ci

on:
  pull_request:
  push:
    branches: [main, points/v1]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
      contracts: ${{ steps.diff.outputs.contracts }}
      tests: ${{ steps.diff.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # a push that opens a branch has an all-zero `before`; compare with the parent commit
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD~1; fi
          files=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          echo "web=$(has '^(web/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "contracts=$(has '^(src/|test/|script/|lib/|foundry\.toml$|foundry\.lock$|remappings\.txt$|\.gitmodules$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          tests=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- 'test/*.t.sol' 'test/**/*.t.sol' | sort -u | tr '\n' ' ')
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://gateway.tenderly.co/public/mainnet' }}
      MAINNET_RPC_URL: http://127.0.0.1:8545
      STACK: master
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      # compiler cache: a restored out/ and cache/ make the build incremental
      - uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-${{ hashFiles('src/**', 'test/**', 'script/**') }}
          restore-keys: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-
      # master stack fixture: artcoins launcher commit 6d099486 deployed onto a mainnet fork at block 26158000,
      # dumped to script/config/stack-master-26158000.hex (rebuild recipe: docs/RUNBOOK.md section 7). The
      # fork tests target it, so anvil forks mainnet at the pin block and loads the dump the way
      # script/dev/anvil.sh does (anvil_loadState over curl, the dump exceeds the argv limit).
      - name: master stack anvil
        run: |
          nohup anvil --fork-url "$UPSTREAM_RPC_URL" --fork-block-number 26158000 --chain-id 31337 --port 8545 \
            --auto-impersonate --retries 10 --timeout 60000 > anvil.log 2>&1 &
          for _ in $(seq 1 60); do cast chain-id --rpc-url "$MAINNET_RPC_URL" >/dev/null 2>&1 && break; sleep 1; done
          printf '{"jsonrpc":"2.0","id":1,"method":"anvil_loadState","params":["%s"]}' "$(cat script/config/stack-master-26158000.hex)" |
            curl -sf -X POST "$MAINNET_RPC_URL" -H 'content-type: application/json' --data @- | tee load.json
          grep -q '"result":true' load.json
      - run: forge build
      - name: touched test files
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
        run: |
          if [ -z "${TESTS// /}" ]; then
            echo "no test files touched"
            exit 0
          fi
          for f in $TESTS; do
            echo "::group::$f"
            forge test --match-path "$f" -vv --chain-id 1
            echo "::endgroup::"
          done
      # the local deploy path (preflight, deploy, postflight) on the fixture anvil: the test runner does not enforce the
      # script-only guards of forge script, so a broken deploy path fails here
      - name: local deploy
        run: STACK=master RPC_URL=http://127.0.0.1:8545 script/deploy.sh local

  ci-ok:
    if: always()
    needs: [changes, web, contracts]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.web.result }} ${{ needs.contracts.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "a job ended $r"; exit 1 ;;
            esac
          done
          echo "all jobs succeeded or were skipped"

# the npm workspaces: web/ (typecheck, the selfchecks and a production build), keeper/ (typecheck and the unit
# tests) and packages/engine, which both import. Reusable: called by ci and candidate.
name: web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # one lockfile at the root installs every workspace
      - run: npm ci
        working-directory: .
      - run: npx tsc --noEmit
      - run: npm run check
      # next's build cache, keyed on the lockfile and the sources
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/lib/**', 'packages/engine/**') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - run: npm run typecheck
        working-directory: keeper
      - run: npm test
        working-directory: keeper

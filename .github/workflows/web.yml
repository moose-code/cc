# web/: typecheck, the selfchecks and a production build. Runs on changes under web/ and is
# called by the candidate workflow.
name: web

on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  push:
    branches: [main, points/v1]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_call:

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check
      # next's build cache, keyed on the lockfile and the sources
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/lib/**') }}
          restore-keys: next-${{ hashFiles('web/package-lock.json') }}-
      - run: npm run build

# The web, keeper and indexer source checks. Reusable: called by ci and candidate.
name: web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            indexer/package-lock.json
      # one lockfile at the root installs every workspace
      - run: npm ci
        working-directory: .
      # The web schema guard and Ponder's own codegen/typecheck both use this install.
      - run: npm ci
        working-directory: indexer
      - run: npm run codegen
        working-directory: indexer
      - run: npm run typecheck
        working-directory: indexer
      - run: bash script/dev/test-indexer-deploy-guards.sh
        working-directory: .
      - run: npx tsc --noEmit
      - run: npm run check
      # next's build cache, keyed on the lockfile and the sources
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/lib/**', 'packages/engine/**') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - run: npm run typecheck
        working-directory: keeper
      - run: npm test
        working-directory: keeper

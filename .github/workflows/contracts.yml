# Per change, the AGENTS.md rule: forge build plus the test files the change touched. The full suite,
# the rehearsal and the deep invariants run in the candidate workflow.
# Fork tests read MAINNET_RPC_URL and FORK_BLOCK. MAINNET_RPC_URL is the repo secret when set, else
# the public tenderly gateway, which serves archive state at the pinned block. foundry's rpc cache
# (saved by foundry-toolchain) holds the pinned block's state across runs.
name: contracts

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "script/**"
      - "lib/**"
      - "foundry.toml"
      - "foundry.lock"
      - "remappings.txt"
      - ".gitmodules"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main, points/v1]
    paths:
      - "src/**"
      - "test/**"
      - "script/**"
      - "lib/**"
      - "foundry.toml"
      - "foundry.lock"
      - "remappings.txt"
      - ".gitmodules"
      - ".github/workflows/contracts.yml"

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-touched-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://gateway.tenderly.co/public/mainnet' }}
      FORK_BLOCK: "26158000"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      # compiler cache: a restored out/ and cache/ make the build incremental
      - uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-${{ hashFiles('src/**', 'test/**', 'script/**') }}
          restore-keys: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-
      - run: forge build
      - name: touched test files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # a push that opens a branch has an all-zero `before`; compare with the parent commit
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD~1; fi
          files=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- 'test/*.t.sol' 'test/**/*.t.sol' | sort -u)
          if [ -z "$files" ]; then
            echo "no test files touched"
            exit 0
          fi
          for f in $files; do
            echo "::group::$f"
            forge test --match-path "$f" -vv
            echo "::endgroup::"
          done

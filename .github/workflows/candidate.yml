# The frozen candidate run (AGENTS.md): the full suite with the launch rehearsal, optionally the
# deep invariants, and the web checks. Started by hand on the candidate commit.
name: candidate

on:
  workflow_dispatch:
    inputs:
      deep:
        description: "also run the deep invariant suites"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UPSTREAM_RPC_URL: ${{ secrets.FORK_URL || 'https://ethereum-rpc.publicnode.com' }}
      MAINNET_RPC_URL: http://127.0.0.1:8545
      FORK_BLOCK: "26208025"
      CANDIDATE_RUN: "1"
      REHEARSAL: "1"
      REQUIRE_UPSTREAM_BALANCE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-${{ hashFiles('src/**', 'test/**', 'script/**') }}
          restore-keys: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-
      # Pin the deployed v2 stack to the same block as the local lifecycle and review record.
      - name: mainnet fork anvil
        run: |
          nohup anvil --fork-url "$UPSTREAM_RPC_URL" --fork-block-number "$FORK_BLOCK" --chain-id 31337 --port 8545 \
            --auto-impersonate --retries 10 --timeout 60000 > anvil.log 2>&1 &
          for _ in $(seq 1 60); do cast chain-id --rpc-url "$MAINNET_RPC_URL" >/dev/null 2>&1 && break; sleep 1; done
          cast chain-id --rpc-url "$MAINNET_RPC_URL"
      # test/UpstreamBalance.t.sol and the production module variant of test/LaunchDayPhase2.t.sol run against Jack's
      # contracts built from jckbtchr-vv/credits at the commit pinned in the script. REQUIRE_UPSTREAM_BALANCE makes them
      # fail instead of skip, and the script fails without the secret or on any drift from its pins
      - name: upstream balance artifact
        env:
          UPSTREAM_CREDITS_TOKEN: ${{ secrets.UPSTREAM_CREDITS_TOKEN }}
        run: script/tools/upstream-balance.sh
      - run: forge build
      - name: indexer ABI pins
        run: |
          node indexer/scripts/gen-abis.mjs
          git diff --exit-code -- indexer/abis
      - run: forge test -vv --chain-id 1
      - name: deep invariants
        if: ${{ inputs.deep }}
        env:
          INVARIANT_DEEP: "1"
          FOUNDRY_INVARIANT_RUNS: "64"
          FOUNDRY_INVARIANT_DEPTH: "200"
        run: forge test --match-contract '.*Deep' -vv --chain-id 1

  # Local chain-id-1 lifecycle with forked protocol code, impersonated and funded actors, real pool swaps,
  # signed Seaport orders and the keeper binary (script/dev/e2e-real.sh, docs/RUNBOOK.md section 7).
  e2e-real:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CANDIDATE_RUN: "1"
      FORK_BLOCK: "26208025"
      FORK_URL: ${{ secrets.FORK_URL || 'https://gateway.tenderly.co/public/mainnet' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
      - run: npm ci
      - run: npm ci
        working-directory: indexer
      - run: npm test
        working-directory: indexer
      # Always rebuild the chain state for the frozen candidate.
      # Jack's pinned balance token, required by both e2e-real.sh phase 6/7 and the dev seed post path
      - name: upstream balance artifact
        env:
          UPSTREAM_CREDITS_TOKEN: ${{ secrets.UPSTREAM_CREDITS_TOKEN }}
        run: script/tools/upstream-balance.sh
      - run: FRESH=1 script/dev/e2e-real.sh
      # the LAUNCH_ONLY record guards of the deferred launch on its own anvil (port 8794)
      - run: script/dev/test-launch-only-guards.sh
      # Seed a separate local fork, then check the chain reads and Ponder's Postgres projection.
      # Ports 8619 and 8618 are local Anvil instances, never mainnet.
      - name: dev seed post path
        env:
          FORK_URL: ${{ secrets.FORK_URL || 'https://gateway.tenderly.co/public/mainnet' }}
        run: |
          PORT=8619 PHASE=post FRESH=1 FORK_BLOCK=26208025 REQUIRE_UPSTREAM_BALANCE=true script/dev/local.sh
          PORT=8619 script/dev/check-post.sh
          DATABASE_URL=postgresql://postgres@127.0.0.1:5432/postgres PORT=8619 script/dev/check-indexer.sh
          PORT=8619 script/dev/local.sh stop

  web:
    uses: ./.github/workflows/web.yml

  # The mainnet signing and interrupted-deploy recovery path, broadcast only to a local chain-id-1 Anvil fork.
  signer-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORK_URL: ${{ secrets.FORK_URL || 'https://gateway.tenderly.co/public/mainnet' }}
      CANDIDATE_RUN: "1"
      FORK_BLOCK: "26208025"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: script/dev/rehearse-signer.sh

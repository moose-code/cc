# The frozen candidate run (AGENTS.md): the full suite with the launch rehearsal, optionally the
# deep invariants, and the web checks. Started by hand on the candidate commit.
name: candidate

on:
  workflow_dispatch:
    inputs:
      deep:
        description: "also run the deep invariant suites"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UPSTREAM_RPC_URL: ${{ secrets.FORK_URL || 'https://ethereum-rpc.publicnode.com' }}
      MAINNET_RPC_URL: http://127.0.0.1:8545
      CANDIDATE_RUN: "1"
      REHEARSAL: "1"
      REQUIRE_UPSTREAM_BALANCE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-${{ hashFiles('src/**', 'test/**', 'script/**') }}
          restore-keys: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-
      # the deployed v2 stack (factory 0xC27e182e) is live on mainnet: anvil forks a recent block of it
      - name: mainnet fork anvil
        run: |
          latest=$(cast block-number --rpc-url "$UPSTREAM_RPC_URL")
          nohup anvil --fork-url "$UPSTREAM_RPC_URL" --fork-block-number $((latest - 100)) --chain-id 31337 --port 8545 \
            --auto-impersonate --retries 10 --timeout 60000 > anvil.log 2>&1 &
          for _ in $(seq 1 60); do cast chain-id --rpc-url "$MAINNET_RPC_URL" >/dev/null 2>&1 && break; sleep 1; done
          cast chain-id --rpc-url "$MAINNET_RPC_URL"
      # test/UpstreamBalance.t.sol and the production module variant of test/LaunchDayPhase2.t.sol run against Jack's
      # contracts built from jckbtchr-vv/credits at the commit pinned in the script. REQUIRE_UPSTREAM_BALANCE makes them
      # fail instead of skip, and the script fails without the secret or on any drift from its pins
      - name: upstream balance artifact
        env:
          UPSTREAM_CREDITS_TOKEN: ${{ secrets.UPSTREAM_CREDITS_TOKEN }}
        run: script/tools/upstream-balance.sh
      - run: forge build
      - run: forge test -vv --chain-id 1
      - name: deep invariants
        if: ${{ inputs.deep }}
        env:
          INVARIANT_DEEP: "1"
          FOUNDRY_INVARIANT_RUNS: "64"
          FOUNDRY_INVARIANT_DEPTH: "200"
        run: forge test --match-contract '.*Deep' -vv --chain-id 1

  web:
    uses: ./.github/workflows/web.yml

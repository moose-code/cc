# The frozen candidate run (AGENTS.md): the full suite with the launch rehearsal, optionally the
# deep invariants, and the web checks. Started by hand on the candidate commit.
name: candidate

on:
  workflow_dispatch:
    inputs:
      deep:
        description: "also run the deep invariant suites"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UPSTREAM_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://gateway.tenderly.co/public/mainnet' }}
      MAINNET_RPC_URL: http://127.0.0.1:8545
      STACK: master
      CANDIDATE_RUN: "1"
      REHEARSAL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-${{ hashFiles('src/**', 'test/**', 'script/**') }}
          restore-keys: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-
      # master stack fixture: artcoins launcher commit 6d099486 deployed onto a mainnet fork at block 26158000,
      # dumped to script/config/stack-master-26158000.hex (rebuild recipe: docs/RUNBOOK.md section 7). The
      # fork tests target it, so anvil forks mainnet at the pin block and loads the dump the way
      # script/dev/anvil.sh does (anvil_loadState over curl, the dump exceeds the argv limit).
      - name: master stack anvil
        run: |
          nohup anvil --fork-url "$UPSTREAM_RPC_URL" --fork-block-number 26158000 --chain-id 31337 --port 8545 \
            --auto-impersonate --retries 10 --timeout 60000 > anvil.log 2>&1 &
          for _ in $(seq 1 60); do cast chain-id --rpc-url "$MAINNET_RPC_URL" >/dev/null 2>&1 && break; sleep 1; done
          printf '{"jsonrpc":"2.0","id":1,"method":"anvil_loadState","params":["%s"]}' "$(cat script/config/stack-master-26158000.hex)" |
            curl -sf -X POST "$MAINNET_RPC_URL" -H 'content-type: application/json' --data @- | tee load.json
          grep -q '"result":true' load.json
      - run: forge build
      - run: forge test -vv --chain-id 1
      - name: deep invariants
        if: ${{ inputs.deep }}
        env:
          INVARIANT_DEEP: "1"
          FOUNDRY_INVARIANT_RUNS: "64"
          FOUNDRY_INVARIANT_DEPTH: "200"
        run: forge test --match-contract '.*Deep' -vv --chain-id 1

  web:
    uses: ./.github/workflows/web.yml

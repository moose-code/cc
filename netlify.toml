# Netlify build for the web app in web/. Values here are public (inlined into the client bundle) and override
# same-named variables set in the Netlify UI. Server-only values live in the UI's functions scope, never here:
# KEEPER_MARKET_URL (the keeper's market view origin, https://cc-keeper-mainnet.fly.dev) and the secret
# KEEPER_MARKET_TOKEN (`netlify env:set KEEPER_MARKET_TOKEN <token> --secret --scope functions`, the keeper's
# MARKET_VIEW_TOKEN). OPENSEA_API_KEY is no longer read by the website and can be removed from its store.

[build]
  base = "web"
  # NEXT_PUBLIC_SITE_URL falls back to Netlify's URL of the deploy (production domain or deploy preview origin),
  # so og:image urls are absolute on every deploy.
  command = "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-$URL} npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_CHAIN_ID = "1"
  # the mainnet indexer app in indexer/fly.mainnet.toml
  NEXT_PUBLIC_INDEXER_URL = "https://cc-indexer-mainnet.fly.dev"
  # CreditStrategy deploy block, as in indexer/env/mainnet.env STRATEGY_START_BLOCK
  NEXT_PUBLIC_STRATEGY_START_BLOCK = "26037623"
  # From the tracked mainnet deployment record deployments/1.json. Set here, not only in the Netlify UI, so every
  # context (production, deploy previews, branch deploys) builds against the same mainnet Core.
  NEXT_PUBLIC_CORE = "0xcdb1889ae12074d750CD9B8531B692015465e0dD"
  NEXT_PUBLIC_DEPLOY_BLOCK = "26229330"
  NEXT_PUBLIC_STRATEGY_ADAPTER = "0x5757788D0A6dF507dba064d66532F0b630Be1dc9"
  NEXT_PUBLIC_SEAPORT_ADAPTER = "0x40302D497436bcC03e0Af2138Ec325C68DF3B0c8"
  NEXT_PUBLIC_POOL_HOOK = "0x866F31562dDe70D7B989C2529a9deFFFFd3bE8CC"
  NEXT_PUBLIC_POOL_FEE = "8388608"
  NEXT_PUBLIC_POOL_TICK_SPACING = "200"
  # Optional. A real WalletConnect project id improves wallet reliability; a placeholder is used when unset.
  # NEXT_PUBLIC_WC_PROJECT_ID = ""
  # Mainnet browser reads use /api/rpc. Optional server-only RPC_URL selects a dedicated Tenderly endpoint;
  # keep credential-bearing URLs in Netlify's Functions secret store. NEXT_PUBLIC_RPC_URL is local-only.
